[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nudgesim"
version = "1.0.0"
description = "NudgeSim: a payoff-instrumented multi-agent testbed for counter-misinformation intervention timing and tone"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jihyung Kim" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "statsmodels>=0.14",
  "networkx>=3.2",
  "matplotlib>=3.8",
  "pyarrow>=14",
  "pyyaml>=6",
  "lifelines>=0.27",
]

[project.optional-dependencies]
llm = ["openai>=1.40", "anthropic>=0.34", "httpx>=0.27"]
dev = ["pytest>=7.4", "pytest-asyncio>=0.23"]

[project.scripts]
nudgesim = "nudgesim.cli:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["nudgesim*", "analysis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
